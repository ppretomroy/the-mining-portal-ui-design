<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="icon" type="image/x-icon" href="#">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .container {
            background-color: #1E1E1E;
            padding: 2.5em;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            max-width: 380px;
            width: 100%;
            text-align: center;
        }

        .login-form h2 {
            font-size: 24px;
            font-weight: bold;
            color: #EFFF0B;
        }

        .login-form p {
            color: white;
            font-size: 14px;
            margin-bottom: 1.5em;
        }

        .login-form label {
            display: block;
            text-align: left;
            font-size: 14px;
            margin-top: 1em;
            color: #333;
        }

        .login-form input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #121212;
            border-radius: 8px;
            font-size: 16px;
            background-color: #141414;
            transition: all 0.3s ease;
        }

        .login-form input:focus {
            border-color: #074595;
            background-color: #EFFF0B;
        }

        .login-form button {
            width: 100%;
            padding: 12px;
            margin-top: 1.5em;
            background-color: #EFFF0B;
            color: #121212;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .login-form button:hover {
            background-color: #FF9D00;
        }

        .forgot-password, .register-link {
            font-size: 14px;
            color: #074595;
            text-decoration: none;
            margin-top: 15px;
            display: block;
        }

        .forgot-password:hover, .register-link:hover {
            text-decoration: underline;
        }

        .container .logo {
            display: block;
            margin-bottom: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #1E1E1E;
            margin-left: auto;
            margin-right: auto;
        }

    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script>
        var firebaseConfig = {
              apiKey: "AIzaSyDq-4uvlZBtpxmrdFMzkCPHUvNCmaw61BY",
              authDomain: "testing-portal-6846b.firebaseapp.com",
              databaseURL: "https://testing-portal-6846b-default-rtdb.asia-southeast1.firebasedatabase.app",
              projectId: "testing-portal-6846b",
              storageBucket: "testing-portal-6846b.firebasestorage.app",
              messagingSenderId: "973086762926",
              appId: "1:973086762926:web:ebdde2a1e00326a0ce8a3f",
              measurementId: "G-K5ESRTEMKD"
        };
        firebase.initializeApp(firebaseConfig);

        document.addEventListener('DOMContentLoaded', function () {
            firebase.auth().onAuthStateChanged((user) => {
                if (user) {
                    window.location.href = "scam.html";
                }
            });

            // Login functionality
            document.getElementById('loginForm').addEventListener('submit', function (event) {
                event.preventDefault();
                var email = document.getElementById('email').value;
                var password = document.getElementById('password').value;

                firebase.auth().signInWithEmailAndPassword(email, password)
                    .then((userCredential) => {
                        window.location.href = "home.html";
                    })
                    .catch((error) => {
                        var errorCode = error.code;
                        var errorMessage = error.message;
                        alert(errorMessage);
                    });
            });

            // Register functionality
            document.getElementById('registerLink').addEventListener('click', function () {
                var email = prompt("Enter your email:");
                var password = prompt("Enter your password:");
                if (email && password) {
                    firebase.auth().createUserWithEmailAndPassword(email, password)
                        .then((userCredential) => {
                            alert("Account created successfully!");
                            window.location.href = "home.html";
                        })
                        .catch((error) => {
                            var errorCode = error.code;
                            var errorMessage = error.message;
                            alert(errorMessage);
                        });
                }
            });

            // Forgot password functionality
            document.getElementById('forgotPassword').addEventListener('click', function () {
                var email = prompt("Please enter your email:");
                if (email) {
                    firebase.auth().sendPasswordResetEmail(email)
                        .then(() => {
                            alert("Password reset email sent!");
                        })
                        .catch((error) => {
                            var errorCode = error.code;
                            var errorMessage = error.message;
                            alert(errorMessage);
                        });
                }
            });
        });
    </script>
</head>
<body>
    <div class="container">
        <div class="login-form">
            <h2>登录</h2>
            <p>登录您的帐户，填写正确的信息。</p>
            <form id="loginForm">
                <label for="email">你的电子邮件</label>
                <input type="email" id="email" placeholder="名称@例子.com" required>
                <label for="password">输入密码。</label>
                <input type="password" id="password" placeholder="*********" required>
                <button type="submit">登录</button>
            </form>
        </div>
    </div>
</body>
</html>
